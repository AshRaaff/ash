<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя ❤</title>
<meta property="og:title" content="Тебе сообщение ❤">
<meta property="og:description" content="Нажми, чтобы открыть">
<style>
  :root{--text-main:"Я тебя очень люблю";--x:0}
  html,body{margin:0;height:100%;overflow:hidden;background:#12020a;font-family:Georgia,"Times New Roman",serif;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #bg{background:radial-gradient(circle at 50% 45%,#7a0a30 0%,#3b0518 55%,#12020a 100%)}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;pointer-events:none}
  #intro{cursor:pointer;pointer-events:auto;transition:opacity .8s,transform .8s}
  #intro .big{font-size:96px;animation:beat 1.1s infinite;filter:drop-shadow(0 0 24px #ff3d71)}
  #intro p{font-size:22px;margin:14px 0 0;opacity:.9}
  #love{position:absolute;left:0;right:0;bottom:11%;padding:0 20px;opacity:0;transition:opacity 1s}
  #love.show{opacity:1}
  #love h1{font-size:clamp(34px,9.5vw,76px);margin:0;line-height:1.15;
    background:linear-gradient(90deg,#fff,#ffb3c7,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 3s linear infinite;filter:drop-shadow(0 0 18px rgba(255,61,113,.8))}
  #love .sub{font-size:clamp(17px,4.8vw,26px);margin-top:14px;opacity:.95;min-height:1.4em;text-shadow:0 0 12px rgba(255,61,113,.7)}
  #hint{position:fixed;top:18px;left:0;right:0;text-align:center;color:#ffd0dc;font-size:15px;opacity:0;transition:opacity 1s;pointer-events:none}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.09)}}
  @keyframes shine{to{background-position:200% center}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<div id="hint">Касайся экрана — будут сердечки 💕</div>

<div id="ui">
  <div id="intro">
    <div class="big">💌</div>
    <p>Нажми, у меня для тебя сообщение</p>
  </div>
  <div id="love">
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
  </div>
</div>

<script>
/* ======== ТЕКСТЫ — меняй здесь ======== */
const TITLE = "Котапульта моя родная ❤️";
const SUBTITLES = [
  "Мы ждем тебя дома",
  "Ты самый прекрасный человек во вселенной",
  "Я тебя очень люблю ❤️",
];
/* ===================================== */

const bg = document.getElementById('bg'), fx = document.getElementById('fx');
const bctx = bg.getContext('2d'), ctx = fx.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  for(const c of [bg,fx]){ c.width = W*DPR; c.height = H*DPR; }
  bctx.setTransform(DPR,0,0,DPR,0,0); ctx.setTransform(DPR,0,0,DPR,0,0);
  buildTargets();
}
addEventListener('resize', resize);

/* --- форма сердца --- */
function heartPt(t){ // t: 0..2π
  return {
    x: 16*Math.pow(Math.sin(t),3),
    y: -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))
  };
}

/* --- частицы, складывающиеся в большое сердце --- */
let targets = [], particles = [];
function buildTargets(){
  const N = innerWidth < 600 ? 700 : 1200;
  const scale = Math.min(W, H*0.62) / 40;
  const cx = W/2, cy = H*0.36;
  targets = [];
  for(let i=0;i<N;i++){
    const t = Math.random()*Math.PI*2;
    const p = heartPt(t);
    const k = Math.sqrt(Math.random());          // заполнение внутри
    targets.push({x: cx + p.x*scale*k, y: cy + p.y*scale*k});
  }
  particles.forEach((p,i)=>{ const t = targets[i % targets.length]; p.tx=t.x; p.ty=t.y; });
}
function makeParticles(){
  particles = targets.map(t=>({
    x: W/2 + (Math.random()-.5)*W*1.4,
    y: H + Math.random()*H*0.6,
    tx: t.x, ty: t.y, vx:0, vy:0,
    r: 1.2 + Math.random()*2.2,
    hue: 335 + Math.random()*25,
    ph: Math.random()*6.28
  }));
}

/* --- летящие эмодзи-сердечки, вспышки, искры --- */
const EMO = ['❤️','💖','💕','💗','💘','💞','🩷'];
let floaters = [], sparks = [], rings = [];
function spawnFloater(x, y, burst){
  floaters.push({
    x: x ?? Math.random()*W, y: y ?? H+30,
    vx: burst ? (Math.random()-.5)*7 : (Math.random()-.5)*0.8,
    vy: burst ? -(2+Math.random()*6) : -(0.8+Math.random()*2.2),
    s: 16 + Math.random()*(burst?30:40),
    a: 1, rot: (Math.random()-.5)*.6, vr: (Math.random()-.5)*.03,
    e: EMO[(Math.random()*EMO.length)|0], sw: Math.random()*6.28, burst
  });
}
function burstAt(x, y){
  for(let i=0;i<16;i++) spawnFloater(x,y,true);
  for(let i=0;i<40;i++){
    const a = Math.random()*6.28, v = 1+Math.random()*5;
    sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,hue:330+Math.random()*30});
  }
  rings.push({x,y,r:4,a:.8});
  if(navigator.vibrate) navigator.vibrate(25);
}

/* --- фон: мягкие светящиеся шары --- */
const orbs = Array.from({length:14},()=>({x:Math.random(),y:Math.random(),r:60+Math.random()*140,s:.0002+Math.random()*.0004,p:Math.random()*6.28}));
function drawBg(t){
  bctx.clearRect(0,0,W,H);
  bctx.globalCompositeOperation='lighter';
  for(const o of orbs){
    const x = (o.x + Math.sin(t*o.s+o.p)*.08)*W, y = (o.y + Math.cos(t*o.s*1.3+o.p)*.08)*H;
    const g = bctx.createRadialGradient(x,y,0,x,y,o.r);
    g.addColorStop(0,'rgba(255,60,110,.16)'); g.addColorStop(1,'rgba(255,60,110,0)');
    bctx.fillStyle = g; bctx.beginPath(); bctx.arc(x,y,o.r,0,6.28); bctx.fill();
  }
  bctx.globalCompositeOperation='source-over';
}

let started = false, t0 = 0, last = 0, beatPhase = 0;
function frame(t){
  requestAnimationFrame(frame);
  drawBg(t);
  ctx.clearRect(0,0,W,H);

  // «биение» сердца из частиц
  const beat = 1 + 0.045*Math.max(0, Math.sin(t*0.0058)) + 0.025*Math.max(0, Math.sin(t*0.0058 - 1.1));
  const cx = W/2, cy = H*0.36;

  if(started){
    ctx.globalCompositeOperation='lighter';
    for(const p of particles){
      const tx = cx + (p.tx-cx)*beat, ty = cy + (p.ty-cy)*beat;
      p.vx += (tx-p.x)*0.012; p.vy += (ty-p.y)*0.012;
      p.vx *= 0.9; p.vy *= 0.9;
      p.x += p.vx + Math.sin(t*.002+p.ph)*.15; p.y += p.vy + Math.cos(t*.002+p.ph)*.15;
      const tw = .55 + .45*Math.sin(t*.004+p.ph);
      ctx.fillStyle = `hsla(${p.hue},100%,${62+tw*18}%,${.55+tw*.4})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';

    // свечение в центре сердца
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*.42);
    g.addColorStop(0,'rgba(255,70,120,.22)'); g.addColorStop(1,'rgba(255,70,120,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    if(t - last > 140){ spawnFloater(); last = t; }
  } else if(t - last > 500){ spawnFloater(); last = t; }

  // кольца
  rings = rings.filter(r=>r.a>.02);
  for(const r of rings){
    ctx.strokeStyle = `rgba(255,140,175,${r.a})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,6.28); ctx.stroke();
    r.r += 5; r.a *= .95;
  }
  // искры
  sparks = sparks.filter(s=>s.life>0);
  ctx.globalCompositeOperation='lighter';
  for(const s of sparks){
    s.x+=s.vx; s.y+=s.vy; s.vy+=.08; s.vx*=.98; s.life-=.016;
    ctx.fillStyle = `hsla(${s.hue},100%,70%,${Math.max(s.life,0)})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,2.2,0,6.28); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  // эмодзи
  floaters = floaters.filter(f=>f.a>0.02 && f.y>-80);
  for(const f of floaters){
    f.sw += .03; f.x += f.vx + Math.sin(f.sw)*.6; f.y += f.vy; f.rot += f.vr;
    if(f.burst){ f.vy += .09; f.vx *= .99; f.a -= .008; } else if(f.y < H*.2) f.a -= .015;
    ctx.save(); ctx.globalAlpha = Math.max(f.a,0); ctx.translate(f.x,f.y); ctx.rotate(f.rot);
    ctx.font = f.s+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(f.e,0,0); ctx.restore();
  }
}

/* --- печатающийся текст --- */
function typeInto(el, text, speed, done){
  el.textContent=''; let i=0;
  const iv = setInterval(()=>{ el.textContent += text[i++]; if(i>=text.length){ clearInterval(iv); done&&done(); } }, speed);
}
function cycleSubs(){
  const sub = document.getElementById('sub'); let i=0;
  (function next(){
    typeInto(sub, SUBTITLES[i % SUBTITLES.length], 55, ()=>{
      setTimeout(()=>{ sub.style.transition='opacity .6s'; sub.style.opacity=0;
        setTimeout(()=>{ sub.style.opacity=1; i++; next(); },700); }, 2600);
    });
  })();
}

function start(){
  if(started) return; started = true;
  const intro = document.getElementById('intro');
  intro.style.opacity = 0; intro.style.transform='scale(1.4)'; intro.style.pointerEvents='none';
  setTimeout(()=>intro.style.display='none', 800);
  makeParticles();
  burstAt(W/2, H*.4);
  setTimeout(()=>burstAt(W*.25, H*.3), 350);
  setTimeout(()=>burstAt(W*.75, H*.3), 600);
  if(navigator.vibrate) navigator.vibrate([80,60,80,60,160]);
  setTimeout(()=>{
    document.getElementById('love').classList.add('show');
    typeInto(document.getElementById('title'), TITLE, 90, ()=>setTimeout(cycleSubs,400));
    document.getElementById('hint').style.opacity = .85;
    setTimeout(()=>document.getElementById('hint').style.opacity = 0, 6000);
  }, 1200);
  try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){}
}

document.getElementById('intro').addEventListener('click', start);
addEventListener('pointerdown', e=>{ if(started) burstAt(e.clientX, e.clientY); });

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
